<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Bot Game</title>
<!-- Served by scripts/play_online.py: the bot's current game on generals.io, as the bot sees it. -->
<style>
:root {
  --bg: #f1f2ef; --surface: #ffffff; --ink: #1c2023; --muted: #5f686c; --line: #d3d7d3; --accent: #2b6d5f;
  --cell-neutral: #dfe2dc; --cell-fog: #3a4145; --cell-fog-struct: #555d61; --mountain: #8b9195; --board-bg: #c9cdc8;
  --me: #d23c32; --opp: #2f6fd6; --city: #7a6a3a;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --surface: #1c2225; --ink: #e4e7e5; --muted: #98a1a4; --line: #333b3e; --accent: #5fb7a2;
    --cell-neutral: #3b4346; --cell-fog: #23292c; --cell-fog-struct: #394145; --mountain: #6d7478; --board-bg: #0f1214;
    --city: #8f7d47; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --surface: #1c2225; --ink: #e4e7e5; --muted: #98a1a4; --line: #333b3e; --accent: #5fb7a2;
  --cell-neutral: #3b4346; --cell-fog: #23292c; --cell-fog-struct: #394145; --mountain: #6d7478; --board-bg: #0f1214;
  --city: #8f7d47; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
h1 { font-size: 1.4rem; margin: 0; }
.status { font: 0.9rem var(--f-mono); color: var(--muted); }
.status a { color: var(--accent); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }
.boardbox { min-width: 0; }
canvas { display: block; background: var(--board-bg); border-radius: 8px; }
aside { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
.panel h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
table { border-collapse: collapse; width: 100%; font: 0.85rem var(--f-mono); }
td, th { padding: 3px 4px; text-align: right; } td:first-child, th:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.kv { font: 0.85rem var(--f-mono); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.kv span:nth-child(odd) { color: var(--muted); }
label { font-size: 0.85rem; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.hint { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Live bot game</h1>
  <div class="status" id="status">connecting…</div>
  <div class="main">
    <div class="boardbox" id="boardbox"><canvas id="board" aria-label="game board"></canvas></div>
    <aside>
      <div class="panel"><h2>Scoreboard</h2><table id="score"></table></div>
      <div class="panel"><h2>Policy</h2>
        <div class="kv"><span>turn</span><span id="turn">–</span><span>value</span><span id="value">–</span>
          <span>pass</span><span id="pass">–</span></div>
        <label><input type="checkbox" id="showprobs" checked> move probabilities</label>
        <div class="hint">Value: the policy's guess of the result, −1 lost to +1 won. Shading: how likely the next move
          starts on that cell. The arrow is the move just sent.</div>
      </div>
    </aside>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let last = -1, frame = null;

function colorOf(owner, me) { return owner === me ? css("--me") : css("--opp"); }

function draw() {
  const f = frame, cv = $("board");
  if (!f || !f.w) return;
  // Whole CSS pixels per cell, the board fits the column and the window height, and the canvas has one backing
  // pixel per device pixel: no scaling by the browser, so cells and numbers stay sharp.
  const top = $("boardbox").getBoundingClientRect().top + scrollY;
  const S = Math.max(8, Math.floor(Math.min($("boardbox").clientWidth / f.w, (innerHeight - Math.min(top, 160) - 24) / f.h)));
  const dpr = devicePixelRatio || 1;
  cv.style.width = S * f.w + "px"; cv.style.height = S * f.h + "px";
  cv.width = Math.round(S * f.w * dpr); cv.height = Math.round(S * f.h * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cities = new Set(f.cities), generals = new Set(f.generals.filter(g => g >= 0));
  const probs = new Map(f.probs);
  for (let i = 0; i < f.w * f.h; i++) {
    const r = Math.floor(i / f.w), c = i % f.w, t = f.terrain[i], x = c * S, y = r * S;
    ctx.fillStyle = t >= 0 ? colorOf(t, f.me) : t === -2 ? css("--mountain") : t === -3 ? css("--cell-fog")
      : t === -4 ? css("--cell-fog-struct") : cities.has(i) ? css("--city") : css("--cell-neutral");
    ctx.fillRect(x + 1, y + 1, S - 2, S - 2);
    if ($("showprobs").checked && probs.has(i)) {
      ctx.fillStyle = `rgba(255, 220, 60, ${Math.min(0.85, 0.15 + probs.get(i))})`;
      ctx.fillRect(x + 1, y + 1, S - 2, S - 2);
    }
    if (cities.has(i) || generals.has(i)) {
      ctx.strokeStyle = generals.has(i) ? "#ffd84a" : "rgba(255,255,255,0.75)"; ctx.lineWidth = Math.max(2, S / 12);
      ctx.strokeRect(x + 3, y + 3, S - 6, S - 6);
    }
    if (t === -2) { ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.moveTo(x + S / 2, y + S * 0.2);
      ctx.lineTo(x + S * 0.8, y + S * 0.8); ctx.lineTo(x + S * 0.2, y + S * 0.8); ctx.fill(); }
    const a = f.armies[i];
    if (a > 0 && t !== -3 && t !== -4) {
      ctx.fillStyle = t >= 0 ? "#fff" : css("--ink");
      ctx.font = `600 ${Math.floor(S * (a >= 1000 ? 0.3 : 0.38))}px ui-monospace, monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(a, x + S / 2, y + S / 2);
    }
  }
  if (f.move) {
    const [a, b] = f.move, ax = (a % f.w + 0.5) * S, ay = (Math.floor(a / f.w) + 0.5) * S;
    const bx = (b % f.w + 0.5) * S, by = (Math.floor(b / f.w) + 0.5) * S;
    // From the edge of the source cell, so the arrow does not cover its army number.
    const sx = ax + (bx - ax) * 0.38, sy = ay + (by - ay) * 0.38;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(3, S / 8); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(bx, by, S / 6, 0, 7); ctx.fill();
  }
}

function render() {
  const f = frame;
  $("status").innerHTML = (f.status || "") + (f.replay ? ` · <a href="${f.replay}" target="_blank" rel="noopener">replay</a>` : "");
  if (!f.w) return;
  $("turn").textContent = `${Math.floor(f.turn / 2)} (tick ${f.turn})`;
  $("value").textContent = f.value.toFixed(2);
  $("pass").textContent = (100 * f.pass).toFixed(1) + " %";
  $("score").innerHTML = "<tr><th>player</th><th>land</th><th>army</th></tr>" + f.names.map((n, i) =>
    `<tr><td><span class="dot" style="background:${colorOf(i, f.me)}"></span>${n || "?"}${i === f.me ? " (bot)" : ""}</td>` +
    `<td>${f.scores[i][0]}</td><td>${f.scores[i][1]}</td></tr>`).join("");
  draw();
}

async function poll() {
  try {
    const f = await (await fetch("/api/frame", { cache: "no-store" })).json();
    if (f.seq !== last) { last = f.seq; frame = f; render(); }
  } catch (e) { $("status").textContent = "bot not reachable: is scripts/play_online.py running?"; }
  setTimeout(poll, 200);
}
$("showprobs").onchange = draw;
addEventListener("resize", draw);
poll();
</script>
</body>
</html>
