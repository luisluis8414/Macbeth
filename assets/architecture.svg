<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Network architecture: the observation goes through a CNN stem and is cut into 3x3 patch tokens, which with 8 player tokens and a CLS token pass a 7-layer transformer encoder; the patch outputs go through a CNN decoder, joined with the stem features, to per-cell move logits; the CLS output gives the pass logit and a 128-bin value distribution. Below: one transformer layer in detail.">
<rect width="920" height="440" fill="#FFFFFF"/>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#4A4D46"/></marker>
  <marker id="ahb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#3B6EA8"/></marker>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1E211E; }
    .b { font-size: 12.5px; font-weight: bold; }
    .t { font-size: 11.5px; }
    .s { font-size: 11px; fill: #6B6E66; }
    .ln { stroke: #4A4D46; stroke-width: 1.3; fill: none; marker-end: url(#ah); }
    .line { stroke: #4A4D46; stroke-width: 1.3; fill: none; }
    .skip { stroke: #3B6EA8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#ahb); }
    .zoom { stroke: #B9B5AA; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .in { fill: #F2F0EA; stroke: #A9A59A; stroke-width: 1; }
    .cnn { fill: #E6EBF2; stroke: #3B6EA8; stroke-width: 1; }
    .out { fill: #EEE8F3; stroke: #6E4E9A; stroke-width: 1; }
  </style>
</defs>

<!-- labels of the main row, all above their element -->
<text class="b" x="60" y="62" text-anchor="middle">observation</text>
<text class="s" x="60" y="78" text-anchor="middle">36 × 36 × 82</text>
<text class="s" x="60" y="93" text-anchor="middle">+ 8 player rows</text>
<text class="b" x="205" y="62" text-anchor="middle">CNN stem</text>
<text class="s" x="205" y="78" text-anchor="middle">2 residual blocks</text>
<text class="s" x="205" y="93" text-anchor="middle">36 × 36 × 64</text>
<text class="b" x="346" y="62" text-anchor="middle">tokens</text>
<text class="s" x="346" y="78" text-anchor="middle">CLS, 8 players,</text>
<text class="s" x="346" y="93" text-anchor="middle">144 patches</text>

<!-- observation -->
<rect class="in" x="40" y="110" width="80" height="80"/>
<rect class="in" x="35" y="115" width="80" height="80"/>
<rect class="in" x="30" y="120" width="80" height="80"/>
<rect class="in" x="25" y="125" width="80" height="80"/>
<rect class="in" x="20" y="130" width="80" height="80"/>
<path d="M33.3,130v80M46.7,130v80M60,130v80M73.3,130v80M86.7,130v80M20,143.3h80M20,156.7h80M20,170h80M20,183.3h80M20,196.7h80" stroke="#DDD9CF" stroke-width="0.8"/>
<path class="ln" d="M128,170H152"/>

<!-- CNN stem -->
<rect class="cnn" x="170" y="120" width="80" height="80"/>
<rect class="cnn" x="165" y="125" width="80" height="80"/>
<rect class="cnn" x="160" y="130" width="80" height="80"/>
<path class="ln" d="M258,200H336"/>
<text class="s" x="297" y="192" text-anchor="middle">3×3 patches</text>

<!-- input tokens -->
<rect x="340" y="97" width="12" height="12" fill="#6E4E9A"/>
<rect x="340" y="115" width="12" height="12" fill="#A9A59A"/>
<rect x="340" y="130" width="12" height="12" fill="#A9A59A"/>
<rect x="340" y="145" width="12" height="12" fill="#A9A59A"/>
<text class="s" x="346" y="168" text-anchor="middle">⋮</text>
<rect x="340" y="175" width="12" height="12" fill="#3B6EA8"/>
<rect x="340" y="190" width="12" height="12" fill="#3B6EA8"/>
<rect x="340" y="205" width="12" height="12" fill="#3B6EA8"/>
<rect x="340" y="220" width="12" height="12" fill="#3B6EA8"/>
<text class="s" x="346" y="248" text-anchor="middle">⋮</text>
<path class="ln" d="M360,170H398"/>

<!-- transformer encoder -->
<rect x="400" y="110" width="180" height="120" rx="8" fill="#E6EBF2" stroke="#3B6EA8" stroke-width="1.2"/>
<text class="b" x="490" y="146" text-anchor="middle">transformer encoder</text>
<text class="t" x="490" y="166" text-anchor="middle">7 layers, width 448</text>
<text class="t" x="490" y="183" text-anchor="middle">8 heads, relative</text>
<text class="t" x="490" y="200" text-anchor="middle">position bias</text>
<path class="ln" d="M582,170H616"/>

<!-- output tokens -->
<rect x="624" y="97" width="12" height="12" fill="#6E4E9A"/>
<rect x="624" y="115" width="12" height="12" fill="#A9A59A"/>
<rect x="624" y="130" width="12" height="12" fill="#A9A59A"/>
<rect x="624" y="145" width="12" height="12" fill="#A9A59A"/>
<text class="s" x="630" y="168" text-anchor="middle">⋮</text>
<rect x="624" y="175" width="12" height="12" fill="#3B6EA8"/>
<rect x="624" y="190" width="12" height="12" fill="#3B6EA8"/>
<rect x="624" y="205" width="12" height="12" fill="#3B6EA8"/>
<rect x="624" y="220" width="12" height="12" fill="#3B6EA8"/>
<text class="s" x="630" y="248" text-anchor="middle">⋮</text>

<!-- heads from the CLS output -->
<path class="line" d="M638,103H660V41"/>
<path class="ln" d="M660,41H698"/>
<path class="ln" d="M660,84H698"/>
<path class="line" d="M660,41V84"/>
<rect x="700" y="28" width="190" height="26" rx="3" class="out"/>
<text class="t" x="795" y="45" text-anchor="middle">pass logit</text>
<rect x="700" y="62" width="190" height="46" rx="3" class="out"/>
<text class="t" x="712" y="81">value</text>
<text class="s" x="712" y="97">128 bins, mean</text>
<path d="M800,100h80" stroke="#6E4E9A" stroke-width="1"/>
<rect x="804" y="98" width="4" height="2" fill="#6E4E9A"/><rect x="809" y="96" width="4" height="4" fill="#6E4E9A"/>
<rect x="814" y="93" width="4" height="7" fill="#6E4E9A"/><rect x="819" y="88" width="4" height="12" fill="#6E4E9A"/>
<rect x="824" y="81" width="4" height="19" fill="#6E4E9A"/><rect x="829" y="75" width="4" height="25" fill="#6E4E9A"/>
<rect x="834" y="72" width="4" height="28" fill="#6E4E9A"/><rect x="839" y="76" width="4" height="24" fill="#6E4E9A"/>
<rect x="844" y="83" width="4" height="17" fill="#6E4E9A"/><rect x="849" y="89" width="4" height="11" fill="#6E4E9A"/>
<rect x="854" y="94" width="4" height="6" fill="#6E4E9A"/><rect x="859" y="97" width="4" height="3" fill="#6E4E9A"/>
<rect x="864" y="98" width="4" height="2" fill="#6E4E9A"/>

<!-- decoder and moves -->
<text class="b" x="745" y="130" text-anchor="middle">CNN decoder</text>
<text class="s" x="745" y="145" text-anchor="middle">conv 3×3, 1×1</text>
<text class="b" x="860" y="130" text-anchor="middle">move logits</text>
<text class="s" x="860" y="145" text-anchor="middle">36 × 36 × 8</text>
<path class="ln" d="M638,200H703"/>
<text class="s" x="670" y="192" text-anchor="middle">unpatchify</text>
<rect class="cnn" x="715" y="155" width="70" height="70"/>
<rect class="cnn" x="710" y="160" width="70" height="70"/>
<rect class="cnn" x="705" y="165" width="70" height="70"/>
<path class="ln" d="M790,200H818"/>
<rect class="out" x="830" y="155" width="70" height="70"/>
<rect class="out" x="825" y="160" width="70" height="70"/>
<rect class="out" x="820" y="165" width="70" height="70"/>

<!-- skip: stem features to the decoder -->
<path class="skip" d="M200,212V412H740V239"/>
<text class="s" x="470" y="406" text-anchor="middle" fill="#3B6EA8">stem features (skip connection)</text>

<!-- zoom: one transformer layer -->
<path class="zoom" d="M400,230L300,290M580,230L690,290"/>
<rect x="300" y="290" width="390" height="95" rx="6" fill="#FBFAF7" stroke="#C3BFB3" stroke-width="1"/>
<text class="s" x="495" y="377" text-anchor="middle">one of the 7 transformer layers</text>
<path class="line" d="M306,340H310"/>
<path class="ln" d="M300,340H310"/>
<rect x="312" y="327" width="40" height="26" rx="3" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="332" y="344" text-anchor="middle">LN</text>
<path class="ln" d="M352,340H364"/>
<rect x="366" y="323" width="112" height="34" rx="3" fill="#E6EBF2" stroke="#3B6EA8"/>
<text class="t" x="422" y="337" text-anchor="middle">self-attention</text>
<text class="s" x="422" y="351" text-anchor="middle">+ rel. position bias</text>
<path class="ln" d="M478,340H487"/>
<circle cx="494" cy="340" r="7" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M490,340h8M494,336v8" stroke="#4A4D46" stroke-width="1.2"/>
<path class="ln" d="M501,340H510"/>
<rect x="512" y="327" width="40" height="26" rx="3" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="532" y="344" text-anchor="middle">LN</text>
<path class="ln" d="M552,340H564"/>
<rect x="566" y="323" width="62" height="34" rx="3" fill="#EEF3EC" stroke="#2F5D46"/>
<text class="t" x="597" y="337" text-anchor="middle">MLP</text>
<text class="s" x="597" y="351" text-anchor="middle">448→1344</text>
<path class="ln" d="M628,340H639"/>
<circle cx="646" cy="340" r="7" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M642,340h8M646,336v8" stroke="#4A4D46" stroke-width="1.2"/>
<path class="ln" d="M653,340H688"/>
<!-- residuals -->
<path class="ln" d="M306,340V307H494V331"/>
<path class="ln" d="M505,340V307H646V331"/>

<text class="s" x="20" y="432">15.5M parameters. The critic (training only) is the same network at width 256 and 4 layers and sees the whole board without fog.</text>
</svg>
