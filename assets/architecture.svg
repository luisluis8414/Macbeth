<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 874 386" width="874" height="386" role="img" aria-label="Network architecture: the observation goes through a CNN stem and is cut into 3x3 patch tokens, which with 8 player tokens and a CLS token pass a 7-layer transformer encoder (one layer shown in detail above it); the CLS output gives the pass logit and a 128-bin value distribution, the patch outputs go through a CNN decoder, joined with the stem features, to per-cell move logits.">
<rect x="-12" y="-12" width="874" height="386" fill="#FFFFFF"/>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#4A4D46"/></marker>
  <marker id="ahb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#3B6EA8"/></marker>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1E211E; }
    .b { font-size: 12.5px; font-weight: bold; }
    .t { font-size: 11.5px; }
    .s { font-size: 11px; fill: #6B6E66; }
    .ln { stroke: #4A4D46; stroke-width: 1.3; fill: none; marker-end: url(#ah); }
    .line { stroke: #4A4D46; stroke-width: 1.3; fill: none; }
    .skip { stroke: #3B6EA8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#ahb); }
    .zoom { stroke: #C9B98F; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .in { fill: #F2F0EA; stroke: #A9A59A; stroke-width: 1; }
    .cnn { fill: #E6EBF2; stroke: #3B6EA8; stroke-width: 1; }
    .tf { fill: #FAF4E6; stroke: #A07818; stroke-width: 1.2; }
    .out { fill: #EEE8F3; stroke: #6E4E9A; stroke-width: 1; }
  </style>
</defs>

<!-- ===== main row, axis y = 190 ===== -->

<!-- observation -->
<rect class="in" x="40" y="132" width="76" height="76"/>
<rect class="in" x="35" y="137" width="76" height="76"/>
<rect class="in" x="30" y="142" width="76" height="76"/>
<rect class="in" x="25" y="147" width="76" height="76"/>
<rect class="in" x="20" y="152" width="76" height="76"/>
<path d="M32.7,152v76M45.3,152v76M58,152v76M70.7,152v76M83.3,152v76M20,164.7h76M20,177.3h76M20,190h76M20,202.7h76M20,215.3h76" stroke="#DDD9CF" stroke-width="0.8"/>
<text class="b" x="58" y="256" text-anchor="middle">observation</text>
<text class="s" x="58" y="272" text-anchor="middle">36 × 36 × 82</text>
<text class="s" x="58" y="287" text-anchor="middle">+ 8 player rows</text>
<path class="ln" d="M122,190H144"/>

<!-- CNN stem -->
<rect class="cnn" x="160" y="142" width="76" height="76"/>
<rect class="cnn" x="155" y="147" width="76" height="76"/>
<rect class="cnn" x="150" y="152" width="76" height="76"/>
<text class="b" x="188" y="256" text-anchor="middle">CNN stem</text>
<text class="s" x="188" y="272" text-anchor="middle">2 residual blocks</text>
<text class="s" x="188" y="287" text-anchor="middle">36 × 36 × 64</text>
<path class="ln" d="M242,205H300"/>
<text class="s" x="271" y="197" text-anchor="middle">3×3 patches</text>

<!-- input tokens -->
<rect x="306" y="150" width="12" height="12" fill="#6E4E9A"/>
<rect x="306" y="166" width="12" height="12" fill="#A9A59A"/>
<rect x="306" y="180" width="12" height="12" fill="#A9A59A"/>
<rect x="306" y="196" width="12" height="12" fill="#3B6EA8"/>
<rect x="306" y="210" width="12" height="12" fill="#3B6EA8"/>
<rect x="306" y="224" width="12" height="12" fill="#3B6EA8"/>
<text class="b" x="312" y="256" text-anchor="middle">tokens</text>
<text class="s" x="312" y="272" text-anchor="middle">CLS, 8 players,</text>
<text class="s" x="312" y="287" text-anchor="middle">144 patches</text>
<path class="ln" d="M324,190H346"/>

<!-- transformer encoder -->
<rect class="tf" x="350" y="145" width="170" height="90" rx="8"/>
<rect x="368" y="157" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="167" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="177" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="187" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="197" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="207" width="134" height="7" rx="2" fill="#E9D9AE"/>
<rect x="368" y="217" width="134" height="7" rx="2" fill="#E9D9AE"/>
<text class="b" x="435" y="256" text-anchor="middle">transformer encoder</text>
<text class="s" x="435" y="272" text-anchor="middle">7 layers, width 448, 8 heads</text>
<text class="s" x="435" y="287" text-anchor="middle">relative position bias</text>
<path class="ln" d="M522,190H544"/>

<!-- output tokens -->
<rect x="550" y="150" width="12" height="12" fill="#6E4E9A"/>
<rect x="550" y="166" width="12" height="12" fill="#A9A59A"/>
<rect x="550" y="180" width="12" height="12" fill="#A9A59A"/>
<rect x="550" y="196" width="12" height="12" fill="#3B6EA8"/>
<rect x="550" y="210" width="12" height="12" fill="#3B6EA8"/>
<rect x="550" y="224" width="12" height="12" fill="#3B6EA8"/>

<!-- CNN decoder -->
<path class="ln" d="M566,205H610"/>
<text class="s" x="588" y="197" text-anchor="middle">patches</text>
<rect class="cnn" x="624" y="142" width="76" height="76"/>
<rect class="cnn" x="619" y="147" width="76" height="76"/>
<rect class="cnn" x="614" y="152" width="76" height="76"/>
<text class="b" x="652" y="256" text-anchor="middle">CNN decoder</text>
<text class="s" x="652" y="272" text-anchor="middle">conv 3×3, conv 1×1</text>
<path class="ln" d="M706,190H728"/>

<!-- move logits -->
<rect class="out" x="744" y="142" width="76" height="76"/>
<rect class="out" x="739" y="147" width="76" height="76"/>
<rect class="out" x="734" y="152" width="76" height="76"/>
<text class="b" x="772" y="256" text-anchor="middle">move logits</text>
<text class="s" x="772" y="272" text-anchor="middle">36 × 36 × 8</text>
<text class="s" x="772" y="287" text-anchor="middle">4 directions × all / half</text>

<!-- skip: stem features into the decoder -->
<path class="skip" d="M232,222H260V322H602V222H610"/>
<text class="s" x="428" y="316" text-anchor="middle" fill="#3B6EA8">stem features (skip connection)</text>

<!-- ===== heads from the CLS output, top right ===== -->
<path class="line" d="M566,156H588V51"/>
<path class="ln" d="M588,51H612"/>
<path class="ln" d="M588,100H612"/>
<rect class="out" x="614" y="38" width="206" height="26" rx="3"/>
<text class="t" x="717" y="55" text-anchor="middle">pass logit</text>
<rect class="out" x="614" y="74" width="206" height="52" rx="3"/>
<text class="t" x="626" y="95">value</text>
<text class="s" x="626" y="111">128 bins, mean</text>
<path d="M722,116h88" stroke="#6E4E9A" stroke-width="1"/>
<rect x="726" y="114" width="5" height="2" fill="#6E4E9A"/><rect x="732" y="111" width="5" height="5" fill="#6E4E9A"/>
<rect x="738" y="107" width="5" height="9" fill="#6E4E9A"/><rect x="744" y="101" width="5" height="15" fill="#6E4E9A"/>
<rect x="750" y="93" width="5" height="23" fill="#6E4E9A"/><rect x="756" y="87" width="5" height="29" fill="#6E4E9A"/>
<rect x="762" y="85" width="5" height="31" fill="#6E4E9A"/><rect x="768" y="89" width="5" height="27" fill="#6E4E9A"/>
<rect x="774" y="96" width="5" height="20" fill="#6E4E9A"/><rect x="780" y="103" width="5" height="13" fill="#6E4E9A"/>
<rect x="786" y="109" width="5" height="7" fill="#6E4E9A"/><rect x="792" y="112" width="5" height="4" fill="#6E4E9A"/>
<rect x="798" y="114" width="5" height="2" fill="#6E4E9A"/>
<text class="s" x="717" y="24" text-anchor="middle">from the CLS token</text>

<!-- ===== one transformer layer, top left ===== -->
<path class="zoom" d="M350,145L230,112M520,145L580,112"/>
<rect x="230" y="14" width="350" height="98" rx="6" fill="#FFFDF8" stroke="#C9B98F" stroke-width="1"/>
<path class="ln" d="M238,66H252"/>
<rect x="254" y="53" width="36" height="26" rx="3" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="272" y="70" text-anchor="middle">LN</text>
<path class="ln" d="M290,66H300"/>
<rect x="302" y="49" width="104" height="34" rx="3" fill="#FAF4E6" stroke="#A07818"/>
<text class="t" x="354" y="63" text-anchor="middle">self-attention</text>
<text class="s" x="354" y="77" text-anchor="middle">+ position bias</text>
<path class="ln" d="M406,66H415"/>
<circle cx="422" cy="66" r="7" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M418,66h8M422,62v8" stroke="#4A4D46" stroke-width="1.2"/>
<path class="ln" d="M429,66H440"/>
<rect x="442" y="53" width="36" height="26" rx="3" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="460" y="70" text-anchor="middle">LN</text>
<path class="ln" d="M478,66H488"/>
<rect x="490" y="49" width="56" height="34" rx="3" fill="#FAF4E6" stroke="#A07818"/>
<text class="t" x="518" y="63" text-anchor="middle">MLP</text>
<text class="s" x="518" y="77" text-anchor="middle">× 3 width</text>
<path class="ln" d="M546,66H553"/>
<circle cx="560" cy="66" r="7" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M556,66h8M560,62v8" stroke="#4A4D46" stroke-width="1.2"/>
<path class="line" d="M567,66H574"/>
<path class="ln" d="M244,66V32H422V57"/>
<path class="ln" d="M434,66V32H560V57"/>
<text class="s" x="405" y="103" text-anchor="middle">one of the 7 layers</text>

<text class="s" x="20" y="352">15.5M parameters. The critic (training only) is the same network at width 256 and 4 layers and sees the whole board without fog.</text>
</svg>
