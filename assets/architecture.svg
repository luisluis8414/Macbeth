<rect x="564" y="58" width="16" height="16" fill="#3B6EA8"/>
<rect x="584" y="58" width="16" height="16" fill="#3B6EA8"/>
<rect x="604" y="58" width="16" height="16" fill="#3B6EA8"/>
<rect x="624" y="58" width="16" height="16" fill="#3B6EA8"/>
<rect x="644" y="58" width="16" height="16" fill="#3B6EA8"/>
<text class="t" x="670" y="71">…</text>
<rect x="690" y="58" width="16" height="16" fill="#3B6EA8"/>

<!-- ============ heads from CLS ============ -->
<path class="plain" d="M378,56V26H860"/>
<path class="ln" d="M860,26H878"/>
<path class="ln" d="M860,26V92H878"/>
<rect class="sub" x="880" y="13" width="170" height="26" fill="#EEE8F3" stroke="#6E4E9A"/>
<text class="t" x="965" y="30" text-anchor="middle">pass logit</text>
