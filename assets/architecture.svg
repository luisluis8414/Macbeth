<path class="ln" d="M716,66H800V172"/>
<text class="s" x="758" y="60" text-anchor="middle">unpatchify</text>
<rect class="cnn" x="790" y="185" width="80" height="80"/>
<rect class="cnn" x="785" y="190" width="80" height="80"/>
<rect class="cnn" x="780" y="195" width="80" height="80"/>
