<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 470" width="1070" height="470" role="img" aria-label="Network architecture: the 36x36x82 observation goes through a CNN stem, is cut into 3x3 patches and embedded as tokens together with 8 player tokens and a CLS token, passes 7 transformer layers with relative position bias, and a CNN decoder turns the patch outputs back into per-cell move logits; the CLS token gives the pass logit and a 128-bin value distribution">
<rect width="1070" height="470" fill="#FFFFFF"/>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="#4A4D46"/></marker>
  <marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="#3B6EA8"/></marker>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1E211E; }
    .b { font-size: 12.5px; font-weight: bold; }
    .t { font-size: 11.5px; }
    .s { font-size: 11px; fill: #6B6E66; }
    .ln { stroke: #4A4D46; stroke-width: 1.3; fill: none; marker-end: url(#ah); }
    .plain { stroke: #4A4D46; stroke-width: 1.3; fill: none; }
    .skip { stroke: #3B6EA8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#ahb); }
    .in { fill: #F2F0EA; stroke: #A9A59A; stroke-width: 1; }
    .cnn { fill: #E6EBF2; stroke: #3B6EA8; stroke-width: 1; }
    .outm { fill: #EEE8F3; stroke: #6E4E9A; stroke-width: 1; }
    .sub { stroke-width: 1; rx: 3; }
  </style>
</defs>

<!-- ============ input ============ -->
<rect class="in" x="50" y="230" width="80" height="80"/>
<rect class="in" x="45" y="235" width="80" height="80"/>
<rect class="in" x="40" y="240" width="80" height="80"/>
<rect class="in" x="35" y="245" width="80" height="80"/>
<rect class="in" x="30" y="250" width="80" height="80"/>
<path d="M43.3,250v80M56.7,250v80M70,250v80M83.3,250v80M96.7,250v80M30,263.3h80M30,276.7h80M30,290h80M30,303.3h80M30,316.7h80" stroke="#DDD9CF" stroke-width="0.8"/>
<text class="b" x="80" y="352" text-anchor="middle">observation</text>
<text class="s" x="80" y="368" text-anchor="middle">36 × 36 × 82</text>
<text class="s" x="80" y="383" text-anchor="middle">+ 8 player rows</text>

<path class="ln" d="M137,290H170"/>

<!-- ============ CNN stem ============ -->
<rect class="cnn" x="190" y="240" width="80" height="80"/>
<rect class="cnn" x="185" y="245" width="80" height="80"/>
<rect class="cnn" x="180" y="250" width="80" height="80"/>
<text class="b" x="225" y="352" text-anchor="middle">CNN stem</text>
<text class="s" x="225" y="368" text-anchor="middle">2 residual blocks</text>
<text class="s" x="225" y="383" text-anchor="middle">36 × 36 × 64</text>

<path class="ln" d="M277,290H322V403H364"/>

<!-- ============ input tokens ============ -->
<rect x="370" y="395" width="16" height="16" fill="#6E4E9A"/>
<rect x="394" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="414" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="434" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="454" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="474" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="494" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="514" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="534" y="395" width="16" height="16" fill="#A9A59A"/>
<rect x="564" y="395" width="16" height="16" fill="#3B6EA8"/>
<rect x="584" y="395" width="16" height="16" fill="#3B6EA8"/>
<rect x="604" y="395" width="16" height="16" fill="#3B6EA8"/>
<rect x="624" y="395" width="16" height="16" fill="#3B6EA8"/>
<rect x="644" y="395" width="16" height="16" fill="#3B6EA8"/>
<text class="t" x="670" y="408">…</text>
<rect x="690" y="395" width="16" height="16" fill="#3B6EA8"/>
<text class="s" x="378" y="430" text-anchor="middle">CLS</text>
<text class="s" x="472" y="430" text-anchor="middle">8 players (scoreboard)</text>
<text class="s" x="635" y="430" text-anchor="middle">144 board patches</text>
<text class="s" x="635" y="445" text-anchor="middle">(3 × 3 cells → linear, 448)</text>

<path class="ln" d="M378,393V340"/>
<path class="ln" d="M472,393V340"/>
<path class="ln" d="M635,393V340"/>

<!-- ============ transformer layer ============ -->
<rect x="360" y="92" width="360" height="245" rx="8" fill="#FBFAF7" stroke="#C3BFB3" stroke-width="1.2"/>
<text class="b" x="374" y="114">transformer layer</text>
<text class="s" x="374" y="130">width 448, 8 heads</text>
<text x="388" y="232" text-anchor="middle" font-size="22" font-weight="bold" fill="#6B6E66">× 7</text>

<!-- flow inside -->
<path class="plain" d="M540,337V322"/>
<rect class="sub" x="440" y="300" width="200" height="22" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="540" y="315" text-anchor="middle">LayerNorm</text>
<path class="ln" d="M540,300V288"/>
<rect class="sub" x="440" y="246" width="200" height="40" fill="#E6EBF2" stroke="#3B6EA8"/>
<text class="t" x="540" y="262" text-anchor="middle">multi-head self-attention</text>
<text class="s" x="540" y="278" text-anchor="middle">+ relative position bias</text>
<path class="ln" d="M540,246V234"/>
<circle cx="540" cy="226" r="8" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M535,226h10M540,221v10" stroke="#4A4D46" stroke-width="1.2"/>
<path class="ln" d="M540,218V208"/>
<rect class="sub" x="440" y="186" width="200" height="22" fill="#F2F0EA" stroke="#A9A59A"/>
<text class="t" x="540" y="201" text-anchor="middle">LayerNorm</text>
<path class="ln" d="M540,186V174"/>
<rect class="sub" x="440" y="146" width="200" height="28" fill="#EEF3EC" stroke="#2F5D46"/>
<text class="t" x="540" y="164" text-anchor="middle">MLP 448 → 1344 → 448</text>
<path class="ln" d="M540,146V136"/>
<circle cx="540" cy="128" r="8" fill="#FFFFFF" stroke="#4A4D46" stroke-width="1.2"/>
<path d="M535,128h10M540,123v10" stroke="#4A4D46" stroke-width="1.2"/>
<path class="plain" d="M540,120V92"/>
<!-- residual connections -->
<path class="ln" d="M540,330H680V226H550"/>
<path class="ln" d="M540,214H670V128H550"/>

<path class="ln" d="M378,92V76"/>
<path class="ln" d="M472,92V76"/>
<path class="ln" d="M635,92V76"/>

<!-- ============ output tokens ============ -->
