<text class="s" x="955" y="328" text-anchor="middle">(4 directions × all / half)</text>

<!-- ============ footnote ============ -->
<text class="s" x="30" y="460">15.5M parameters. The critic (training only) has the same architecture at width 256 and 4 layers, and sees the whole board without fog.</text>
</svg>
